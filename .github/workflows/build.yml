
name: Build Thuto Gov APK

on:
  workflow_dispatch:
  push:
    branches:
      - build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Diagnose Android embedding
        run: |
          echo "=== Android manifests ==="
          find android -name AndroidManifest.xml -print

          echo "=== MainActivity files ==="
          find android -name "MainActivity.*" -print

          echo "=== Old Android embedding references ==="
          grep -R -n -E \
            'io\.flutter\.app\.FlutterApplication|io\.flutter\.app\.FlutterActivity|PluginRegistry\.Registrar|registerWith\(' \
            android lib || true

          echo "=== Android project files ==="
          find android -maxdepth 4 -type f -print | sort

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thuto-gov-release-apk-build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
