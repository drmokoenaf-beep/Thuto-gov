// --- APPLY ---
class ApplyPage extends StatefulWidget {
  const ApplyPage({super.key});
  @override
  State<ApplyPage> createState() => _ApplyPageState();
}

class _ApplyPageState extends State<ApplyPage> {
  final _formKey = GlobalKey<FormState>();
  String _type = 'NSFAS Funding';
  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Apply'), backgroundColor: const Color(0xFF2E7D32), foregroundColor: Colors.white),
      body: Form(
        key: _formKey,
        child: ListView(
          padding: const EdgeInsets.all(20),
          children: [
            DropdownButtonFormField(
              value: _type,
              decoration: InputDecoration(labelText: 'Application Type', border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)), filled: true, fillColor: Colors.white),
              items: ['NSFAS Funding', 'School Admission', 'Teacher Post', 'Bursary'].map((e) => DropdownMenuItem(value: e, child: Text(e))).toList(),
              onChanged: (v) => setState(() => _type = v!),
            ),
            const SizedBox(height: 16),
            TextFormField(decoration: _input('Full Name', Icons.person), validator: (v) => v!.isEmpty ? 'Required' : null),
            const SizedBox(height: 12),
            TextFormField(decoration: _input('ID Number', Icons.badge), keyboardType: TextInputType.number),
            const SizedBox(height: 12),
            TextFormField(decoration: _input('Phone - 07...', Icons.phone), keyboardType: TextInputType.phone),
            const SizedBox(height: 20),
            ElevatedButton(
              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF2E7D32), foregroundColor: Colors.white, padding: EdgeInsets.symmetric(vertical: 16), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12))),
              onPressed: () {
                if (_formKey.currentState!.validate()) {
                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('$_type application submitted! Ref: THUTO-${DateTime.now().year}-8821'), backgroundColor: Color(0xFF795548)));
                }
              },
              child: const Text('SUBMIT APPLICATION', style: TextStyle(fontWeight: FontWeight.bold)),
            ),
            const SizedBox(height: 12),
            const Text('Your data is protected under POPIA', textAlign: TextAlign.center, style: TextStyle(fontSize: 11, color: Colors.grey)),
          ],
        ),
      ),
    );
  }
  InputDecoration _input(String label, IconData icon) => InputDecoration(labelText: label, prefixIcon: Icon(icon, color: Color(0xFF795548)), filled: true, fillColor: Colors.white, border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)));
}

// --- STATUS CHECK ---
class StatusPage extends StatefulWidget {
  const StatusPage({super.key});
  @override
  State<StatusPage> createState() => _StatusPageState();
}

class _StatusPageState extends State<StatusPage> {
  final _ctrl = TextEditingController();
  bool _checked = false;
  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Status Check'), backgroundColor: const Color(0xFF795548), foregroundColor: Colors.white),
      body: ListView(
        padding: const EdgeInsets.all(20),
        children: [
          TextField(
            controller: _ctrl,
            decoration: InputDecoration(hintText: 'Enter Ref: THUTO-2026-8821 or ID', prefixIcon: Icon(Icons.search), filled: true, fillColor: Colors.white, border: OutlineInputBorder(borderRadius: BorderRadius.circular(12))),
          ),
          const SizedBox(height: 12),
          ElevatedButton(
            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF795548), foregroundColor: Colors.white, padding: EdgeInsets.symmetric(vertical: 14)),
            onPressed: () => setState(() => _checked = true),
            child: Text('CHECK STATUS'),
          ),
          const SizedBox(height: 20),
          if (_checked)
            Container(
              padding: EdgeInsets.all(20),
              decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(16), border: Border.all(color: Color(0xFF2E7D32))),
              child: Column(
                children: [
                  Icon(Icons.check_circle, size: 60, color: Color(0xFF2E7D32)),
                  SizedBox(height: 10),
                  Text('APPROVED - IN REVIEW', style: TextStyle(fontWeight: FontWeight.bold, color: Color(0xFF2E7D32))),
                  Divider(height: 30),
                  _statusRow('Reference', _ctrl.text.isEmpty ? 'THUTO-2026-8821' : _ctrl.text),
                  _statusRow('Applicant', 'Dr Mokoena'),
                  _statusRow('Type', 'NSFAS Funding'),
                  _statusRow('Soil Stamp', 'Verified at Newcastle KZN'),
                ],
              ),
            ),
        ],
      ),
    );
  }
  Widget _statusRow(String k, String v) => Padding(padding: EdgeInsets.symmetric(vertical: 4), child: Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [Text(k, style: TextStyle(color: Colors.grey)), Text(v, style: TextStyle(fontWeight: FontWeight.bold))]));
}
