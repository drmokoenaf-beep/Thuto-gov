name: Build Thuto Gov - DR MOKOENA
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Create project
        run: |
          flutter create. 
      - name: Build APK
        run: flutter build apk flutter create . --platforms=android --project-name thuto_gov --overwrite
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thuto-gov-apk
          path: build/app/outputs/flutter-apk/app-release.apk
