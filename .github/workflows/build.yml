
name: Build Thuto Gov APK

on:
  workflow_dispatch:
  push:
    branches:
      - Main
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Regenerate Android platform files
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example --project-name thuto_gov

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thuto-gov-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
