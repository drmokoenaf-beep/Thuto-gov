name: Build Thuto Gov APK

on:
  workflow_dispatch:
  push:
    branches:
      - build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Diagnose Android files before generation
        run: |
          echo "=== Android manifests ==="
          find android -name AndroidManifest.xml -print

          echo "=== MainActivity files ==="
          find android -name "MainActivity.*" -print

          echo "=== Android project files ==="
          find android -maxdepth 5 -type f -print | sort

      - name: Generate missing Android project files
        run: flutter create . --platforms=android --project-name=thuto_gov --org=com.example

      - name: Fix Android launcher icon reference
        run: |
          find android -name AndroidManifest.xml -type f -exec sed -i 's/@mipmap\/launcher_icon/@mipmap\/ic_launcher/g' {} +

          echo "=== Launcher icon references ==="
          grep -R -n 'android:icon' android || true

          echo "=== Available launcher icons ==="
          find android/app/src/main/res -type f | grep -E 'ic_launcher|launcher_icon' || true

      - name: Diagnose Android files after generation
        run: |
          echo "=== Android manifests after generation ==="
          find android -name AndroidManifest.xml -print

          echo "=== MainActivity files after generation ==="
          find android -name "MainActivity.*" -print

          echo "=== Old Android embedding references ==="
          grep -R -n -E \
            'io\.flutter\.app\.FlutterApplication|io\.flutter\.app\.FlutterActivity|PluginRegistry\.Registrar' \
            android lib || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: thuto-gov-release-apk-build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
