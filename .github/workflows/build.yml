name: Build Thuto Gov - DR MOKOENA
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'            - name: Ensure Flutter project exists
        run: |
          cp lib/main.dart /tmp/main.dart 2>/dev/null || true
          if [ ! -f pubspec.yaml ]; then
            flutter create . --project-name thuto_gov --org za.gov.thuto --platforms=android --no-pub
          fi
          mkdir -p lib
          cp /tmp/main.dart lib/main.dart
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: thuto-gov-apk
          path: build/app/outputs/flutter-apk/app-release.apk
