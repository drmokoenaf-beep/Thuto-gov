
import 'package:flutter/material.dart';

void main() => runApp(const ThutoGovApp());

class ThutoGovApp extends StatelessWidget {
  const ThutoGovApp({super.key});
  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'Thuto Gov',
      theme: ThemeData(
        useMaterial3: true,
        colorScheme: ColorScheme.fromSeed(
          seedColor: const Color(0xFF2E7D32), // Green
          primary: const Color(0xFF2E7D32),
          secondary: const Color(0xFF795548), // Soil brown
        ),
        scaffoldBackgroundColor: const Color(0xFFEFEBE9), // Light soil
      ),
      home: const MainNav(),
    );
  }
}

class MainNav extends StatefulWidget {
  const MainNav({super.key});
  @override
  State<MainNav> createState() => _MainNavState();
}

class _MainNavState extends State<MainNav> {
  int _index = 0;
  final _pages = const [HomePage(), ApplyPage(), StatusPage()];
  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: _pages[_index],
      bottomNavigationBar: NavigationBar(
        selectedIndex: _index,
        onDestinationSelected: (i) => setState(() => _index = i),
        destinations: const [
          NavigationDestination(icon: Icon(Icons.home_rounded), label: 'Home'),
          NavigationDestination(icon: Icon(Icons.description_rounded), label: 'Apply'),
          NavigationDestination(icon: Icon(Icons.search_rounded), label: 'Status Check'),
        ],
      ),
    );
  }
}

