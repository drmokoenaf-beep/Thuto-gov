
name: Build Thuto Gov Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Check Android project files
        run: |
          echo "Checking Android project files..."
          find android/app/src -type f 2>/dev/null | sort
          echo "Checking obsolete Android v1 embedding references..."
          grep -RInE \
            'io\.flutter\.app\.|PluginRegistry\.Registrar|registerWith\(Registrar' \
            android lib .dart_tool 2>/dev/null || true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Diagnose Android embedding configuration
        run: |
          echo "Checking Android project configuration..."
          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle.properties" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print
          echo "Searching Android configuration for old embedding references..."
          grep -RInE 'io\.flutter\.app\.|PluginRegistry\.Registrar|registerWith\(Registrar|flutterEmbedding|embedding' android 2>/dev/null || true
          echo "Checking Flutter project metadata..."
          find . -maxdepth 3 -type f \( -name ".metadata" -o -name "pubspec.yaml" \) -print
          if [ -f .metadata ]; then
            cat .metadata
          fi

      - name: Check dependencies
        run: flutter pub deps

      - name: Build release APK
        run: flutter build apk --release -v

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thuto-gov-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
