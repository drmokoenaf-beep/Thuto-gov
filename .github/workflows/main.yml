
name: Build Thuto Gov Android APK

on:
  push:
    branches:
      - Main
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Verify Android V2 manifest
        run: |
      - name: Diagnose all Android manifests
        run: |
          echo "Checking Android manifest files..."
          find android -name AndroidManifest.xml -type f -print

          echo "Searching for old Android V1 references..."
          grep -R -n -E 'io\.flutter\.app\.FlutterApplication|io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterFragmentActivity' android || true

          echo "Checking Flutter embedding markers..."
          grep -R -n 'flutterEmbedding' android || true

          echo "Checking MainActivity files..."
          find android/app/src -name '*MainActivity*' -type f -print

          echo "Checking Gradle configuration files..."
          find android -maxdepth 3 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print

          echo "Checking AndroidManifest.xml..."
          cat android/app/src/main/AndroidManifest.xml

          if grep -q 'android:name="io.flutter.app.FlutterApplication"' android/app/src/main/AndroidManifest.xml; then
            echo "ERROR: Obsolete FlutterApplication reference found."
            exit 1
          fi

          if ! grep -q 'android:name="flutterEmbedding"' android/app/src/main/AndroidManifest.xml; then
            echo "ERROR: flutterEmbedding metadata is missing."
            exit 1
          fi

          if ! grep -A 2 'android:name="flutterEmbedding"' android/app/src/main/AndroidManifest.xml | grep -q 'android:value="2"'; then
            echo "ERROR: flutterEmbedding must have android:value=2."
            exit 1
          fi

          echo "Android V2 manifest check passed."

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check dependencies
        run: flutter pub deps

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thuto-gov-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error